396.82" y="288.4509">tokens, typed joins, guarded routes, bounded cycles,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.0793" x="396.82" y="306.157">scope entry/exit activities, completion propagation,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.3573" x="396.82" y="323.863">shallow/deep history, durable resume (scheduler-fired</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.5363" x="396.82" y="341.569">timers, retries, approval deadlines, and durable</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.3882" x="396.82" y="359.275">yields), compensation, and encrypted snapshots.</text></g><g class="entity" data-qualified-name="GMN28" data-source-line="41" id="ent0029"><path d="M444.02,528.4979 L444.02,591.616 L769.9873,591.616 L769.9873,538.4979 L759.9873,528.4979 L444.02,528.4979" fill="#FFF3C9" style="stroke:#181818;stroke-width:0.5;"/><path d="M759.9873,528.4979 L759.9873,538.4979 L769.9873,538.4979 L759.9873,528.4979" fill="#FFF3C9" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.9673" x="450.02" y="547.3949">Reserved next: MeTTaIL Foreign Language Terms,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.0233" x="450.02" y="565.1009">run observability dashboards, and a dedicated</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.8592" x="450.02" y="582.807">hierarchy-canvas editor (see the roadmap).</text></g><!--link *start* to Root--><g class="link" data-entity-1="ent0008" data-entity-2="ent0001" data-link-type="dependency" data-source-line="12" id="lnk9"><path d="M355,69.8679 C355,75.4542 355,83.2857 355,92.7255 C355,97.4453 355,102