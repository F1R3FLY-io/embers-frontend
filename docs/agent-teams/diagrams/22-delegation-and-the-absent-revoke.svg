gthAdjust="spacing" textLength="55.9858" x="452.6972" y="112.0339">(init.rho)</text></g><g class="participant participant-tail" data-entity-uid="part2" data-qualified-name="ledger" data-source-line="14" id="part2-tail"><rect fill="#CBE7CC" height="52.1358" rx="2.5" ry="2.5" style="stroke:#38789E;stroke-width:0.5;" width="134.2455" x="413.5673" y="736.6501"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.2455" x="420.5673" y="758.616">RSpace run ledger</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="55.9858" x="452.6972" y="777.6839">(init.rho)</text></g><g class="participant participant-head" data-entity-uid="part3" data-qualified-name="approver" data-source-line="15" id="part3-head"><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.8796" x="720.7586" y="120.0339">Approver wallet</text><ellipse cx="775.6984" cy="53.5679" fill="#FFD8C2" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M775.6984,61.5679 L775.6984,88.5679 M762.6984,69.5679 L788.6984,69.5679 M775.6984,88.5679 L762.6984,103.5679 M775.6984,88.5679 L788.6984,103.5679" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><g class="participant participant-tail" data-entity-uid="part3" data-qualified-name="approver" data-source-line="15" id="part3-tail"><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.8796" x="720.7586" y="751.616">Approver wallet</text><ellipse cx="775.6984" cy="764.218" fill="#FFD8C2" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M775.6984,772.218 L775.6984,799.218 M762.6984,780.218 L788.6984,780.218 M775.6984,799.218 L762.6984,814.218 M775.6984,799.218 L788.6984,814.218" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><g class="participant participant-head" data-entity-uid="part4" data-qualified-name="other" data-source-line="16" id="part4-head"><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.5197" x="947.9117" y="120.0339">Third party</text><ellipse cx="987.1715" cy="53.5679" fill="#E7DCF5" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M987.1715,61.5679 L987.1715,88.5679 M974.1715,69.5679 L1000.1715,69.5679 M987.1715,88.5679 L974.1715,103.5679 M987.1715,88.5679 L1000.1715,103.5679" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><g class="participant participant-tail" data-entity-uid="part4" data-qualified-name="other" data-source-line="16" id="part4-tail"><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.5197" x="947.9117" y="751.616">Third party</text><ellipse cx="987.1715" cy="764.218" fill="#E7DCF5" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M987.1715,772.218 L987.1715,799.218 M974.1715,780.218 L1000.1715,780.218 M987.1715,799.218 L974.1715,814.218 M987.1715,799.218 L1000.1715,814.218" fill="none" style="stroke:#181818;stroke-width:0.5;"/></g><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="18" id="msg1"><polygon fill="#294C60" points="468.6901,171.5479,478.6901,175.5479,468.6901,179.5479,472.6901,175.5479" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="179.7898" x2="474.6901" y1="175.5479" y2="175.5479"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.6112" x="186.7898" y="152.0328">advanceRun writes wait_ids + grants</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.9342" x="186.7898" y="169.7389">waitId|address, one per approver</text></g><path d="M333,188.5479 L333,251.5479 L627,251.5479 L627,198.5479 L617,188.5479 L333,188.5479" fill="#FFF6C9" style="stroke:#181818;stroke-width:0.5;"/><path d="M617,188.5479 L617,198.5479 L627,198.5479 L617,188.5479" fill="#FFF6C9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.0862" x="339" y="207.4449">A grant is an ACL entry, not a capability:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.2733" x="339" y="225.1509">public string membership, checked against a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.9182" x="339" y="242.8569">chain-derived REV address.</text><g class="message" data-entity-1="part3" data-entity-2="part2" data-source-line="25" id="msg2"><polygon fill="#294C60" points="491.6901,294.0779,481.6901,298.0779,491.6901,302.0779,487.6901,298.0779" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="485.6901" x2="774.6984" y1="298.0779" y2="298.0779"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.1892" x="497.6901" y="274.5629">claimCommand(approve, waitId, revision)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.9601" x="497.6901" y="292.2689">(two-phase signed)</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" data-source-line="26" id="msg3"><line style="stroke:#294C60;stroke-width:1;" x1="480.6901" x2="522.6901" y1="347.49" y2="347.49"/><line style="stroke:#294C60;stroke-width:1;" x1="522.6901" x2="522.6901" y1="347.49" y2="360.49"/><line style="stroke:#294C60;stroke-width:1;" x1="481.6901" x2="522.6901" y1="360.49" y2="360.49"/><polygon fill="#294C60" points="491.6901,356.49,481.6901,360.49,491.6901,364.49,487.6901,360.49" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.4872" x="487.6901" y="323.975">re-derive REV address from rho:deploy:data</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.0083" x="487.6901" y="341.681">membership: grants.contains(waitId|address)</text></g><path d="M9,375.49 L71.303,375.49 L71.303,385.196 L61.303,395.196 L9,395.196 L9,375.49" fill="#FFF3E8" style="stroke:#D97638;stroke-width:1.5;"/><rect fill="none" height="204.924" style="stroke:#D97638;stroke-width:1.5;" width="831.6382" x="9" y="375.49"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="17.303" x="24" y="390.387">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="66.9675" x="86.303" y="389.2489">[authorized]</text><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="29" id="msg4"><polygon fill="#294C60" points="190.7898,414.902,180.7898,418.902,190.7898,422.902,186.7898,418.902" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="184.7898" x2="479.6901" y1="418.902" y2="418.902"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196.1572" x="196.7898" y="413.093">resume; kernel counts decisions</text></g><path d="M19,431.902 L19,494.902 L339,494.902 L339,441.902 L329,431.902 L19,431.902" fill="#FAD8D8" style="stroke:#181818;stroke-width:0.5;"/><path d="M329,431.902 L329,441.902 L339,441.902 L329,431.902" fill="#FAD8D8" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.7923" x="25" y="450.799">Quorum is counted HERE, in the kernel &#8212; on</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.8382" x="25" y="468.505">chain a single grantee can claim. One</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.7413" x="25" y="486.2111">authorized reject resumes regardless of quorum.</text><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="35" id="msg5"><polygon fill="#294C60" points="468.6901,519.7261,478.6901,523.7261,468.6901,527.7261,472.6901,523.7261" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="179.7898" x2="474.6901" y1="523.7261" y2="523.7261"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.9003" x="186.7898" y="517.9171">next advanceRun REPLACES grants wholesale</text></g><line style="stroke:#D97638;stroke-width:1;stroke-dasharray:2,2;" x1="9" x2="840.6382" y1="532.7261" y2="532.7261"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="81.2674" x="14" y="544.485">[unauthorized]</text><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="37" id="msg6"><polygon fill="#294C60" points="763.6984,568.414,773.6984,572.414,763.6984,576.414,767.6984,572.414" style="stroke:#294C60;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#294C60;stroke-width:1;" x1="480.6901" x2="769.6984" y1="572.414" y2="572.414"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.2682" x="487.6901" y="566.605">abort "command actor is unauthorized"</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" data-source-line="40" id="msg7"><line style="stroke:#294C60;stroke-width:2;" x1="969.1715" x2="979.1715" y1="623.826" y2="633.826"/><line style="stroke:#294C60;stroke-width:2;" x1="969.1715" x2="979.1715" y1="633.826" y2="623.826"/><line style="stroke:#294C60;stroke-width:1;" x1="775.6984" x2="974.1715" y1="628.826" y2="628.826"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.7521" x="782.6984" y="605.311">cannot re-delegate</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.4732" x="782.6984" y="623.017">(the grant names one address)</text></g><path d="M120,641.826 L120,721.826 L538,721.826 L538,651.826 L528,641.826 L120,641.826" fill="#FAD8D8" style="stroke:#181818;stroke-width:0.5;"/><path d="M528,641.826 L528,651.826 L538,651.826 L528,641.826" fill="#FAD8D8" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="279.9423" x="184.9353" y="660.723">No revoke command exists. A grant ends only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.0492" x="184.9353" y="678.429">when its wait leaves the ledger at the next</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.3403" x="184.9353" y="696.1351">checkpoint &#8212; by decision, timeout, cancel, or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.7312" x="184.9353" y="713.8411">migrate. There is no mid-wait revocation.</text><?plantuml-src TLNRRkCs47tdLmooBmcg64NIJMmNAA38LbiWQBVUe7q9K8p5iSIQ8hKaPSUz0Fs8Vc6_f4D9jfMqVR9DpkNCEMVee88cI4io0Pu8Qmy_MRVTQBk7tGty_UTV84bJYO4aODCukqCzXzAX2GaK6bMT01e9eIB0jOzb7EtibeJVAjEWmnhMM6nBPriZCwkjWtVvD7_8yr64hr3QlJ8bR53xSMxgdDqFQJUpBxAxpyTfzAabKn3y9W0-e0kgK0qZUtZRS9dcxxdXwo3h9BaXu7PwFvqjEU1HRUXH6NfrUvVERjAKRx_ceis_gkTvVhkSdgx7cOlP_TtjLFmXH7Fk31UBrk6QUT-ICwIVpMLHKR5jh3BXwWBG3nSduA-ILnyRv9bTQq2JBCbnlZ8gJ5nb--p-6Dvb3ylxB1DO1CPoaNRoyVaUjQRGHUBnZ8TOJBERO-nJfPo4sFRGnLdMD_9ulyZozq8CyAw_EhQQ0yeTiXGhHhLtAf3dDYhyhAI7ptg_-6SJZxwLlwEKZhnFm1g2XjEFC8InWQ03T9o1oRtBPYBjQu1Yp0RIx17OQkwG06S0Ge4DhfLMuJ0NJRlMgW0VN3HKJVMQdAzKmtwDB4SZbwYCvpnHLFpjclLIEpvVBN-40Tj44BiwmX7YHD9utixxcQrhTl_b4950Fs0ITq1vPSqLQnFszh