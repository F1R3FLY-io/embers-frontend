<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="825px" preserveAspectRatio="none" style="width:1459px;height:825px;background:#FAFCFF;" version="1.1" viewBox="0 0 1459 825" width="1459px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><rect fill="#FAFCFF" height="825" style="stroke:none;stroke-width:1;" width="1459" x="0" y="0"/><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="579.8359" x="436.5387" y="24.9659">MailQueue entry FSM &#8212; lease-based exactly-one-sender-at-a-time (mail_queue.rho)</text></g><g class="entity" data-qualified-name="queued" data-source-line="12" id="ent0001"><rect fill="#E9F5EA" height="77.2038" rx="12.5" ry="12.5" style="stroke:#477B9B;stroke-width:0.5;" width="158.3335" x="835.51" y="503.1479"/><line style="stroke:#477B9B;stroke-width:0.5;" x1="835.51" x2="993.8435" y1="570.3517" y2="570.3517"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="50.3158" x="845.51" y="523.1139">queued</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.9036" x="845.51" y="542.1818">(claimable when</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.3335" x="845.51" y="561.2497">nextAttempt &lt;= now)</text></g><g class="entity" data-qualified-name="leased" data-source-line="13" id="ent0002"><rect fill="#FFF0D9" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477B9B;stroke-width:0.5;" width="146.3495" x="497.5" y="330.0179"/><line style="stroke:#477B9B;stroke-width:0.5;" x1="497.5" x2="643.8495" y1="378.1538" y2="378.1538"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="42.5738" x="507.5" y="349.9839">leased</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.3495" x="507.5" y="369.0518">{worker, expiresAt}</text></g><g class="entity" data-qualified-name="ambiguous" data-source-line="14" id="ent0003"><rect fill="#FFE0C8" height="77.2038" rx="12.5" ry="12.5" style="stroke:#477B9B;stroke-width:0.5;" width="194.9713" x="473.19" y="74.4379"/><line style="stroke:#477B9B;stroke-width:0.5;" x1="473.19" x2="668.1613" y1="141.6417" y2="141.6417"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.3815" x="483.19" y="94.4039">leased, lease expired</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.9713" x="483.19" y="113.4718">(claimable; outcome of the</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.1214" x="483.19" y="132.5397">prior attempt UNKNOWN)</text></g><g class="entity" data-qualified-name="delivered" data-source-line="15" id="ent0004"><rect fill="#D9EFDF" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477B9B;stroke-width:0.5;" width="83.9518" x="121.7" y="512.6879"/><line style="stroke:#477B9B;stroke-width:0.5;" x1="121.7" x2="205.6518" y1="560.8238" y2="560.8238"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.0258" x="131.7" y="532.6539">delivered</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.9518" x="131.7" y="551.7218">(terminal)</text></g><g class="entity" data-qualified-name="bounced" data-source-line="16" id="ent0005"><rect fill="#F8DADA" height="58.1358" rx="12.5" ry="12.5" style="stroke:#477B9B;stroke-width:0.5;" width="183.2954" x="305.03" y="512.6879"/><line style="stroke:#477B9B;stroke-width:0.5;" x1="305.03" x2="488.3254" y1="560.8238" y2="560.8238"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.6098" x="315.03" y="532.6539">bounced</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.2954" x="315.03" y="551.7218">(terminal; DSN recorded)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="18" id="ent0006"><ellipse cx="1198.67" cy="359.0779" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." data-source-line="26" id="ent0015"><ellipse cx="384.67" cy="726.0279" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="384.67" cy="726.0279" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN18" data-source-line="30" id="ent0019"><path d="M702.67,46.0679 L702.67,109.0479 L668.58,113.0479 L702.67,117.0479 L702.67,180.01 A0,0 0 0 0 702.67,180.01 L1006.6672,180.01 A0,0 0 0 0 1006.6672,180.01 L1006.6672,56.0679 L996.6672,46.0679 L702.67,46.0679 A0,0 0 0 0 702.67,46.0679" fill="#FFF6C9" style="stroke:#181818;stroke-width:0.5;"/><path d="M996.6672,46.0679 L996.6672,56.0679 L1006.6672,56.0679 L996.6672,46.0679" fill="#FFF6C9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.9972" x="708.67" y="64.9649">The known unknown Postfix cannot name: the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.9132" x="708.67" y="82.6709">prior worker may or may not have completed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="265.2523" x="708.67" y="100.377">its SMTP transaction before dying. Here the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.1273" x="708.67" y="118.083">ambiguity is queryable, so the retry decision</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.4422" x="708.67" y="135.789">is policy rather than a guess -- the teams</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200.5772" x="708.67" y="153.495">bridge resolves it against its own</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.4762" x="708.67" y="171.201">fingerprint-keyed run ledger.</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="40" id="ent0022"><path d="M6,641.3579 L6,810.7121 A0,0 0 0 0 6,810.7121 L321.3462,810.7121 A0,0 0 0 0 321.3462,810.7121 L321.3462,651.3579 L311.3462,641.3579 L167.67,641.3579 L163.67,571.2379 L159.67,641.3579 L6,641.3579 A0,0 0 0 0 6,641.3579" fill="#FFF0C7" style="stroke:#181818;stroke-width:0.5;"/><path d="M311.3462,641.3579 L311.3462,651.3579 L321.3462,651.3579 L311.3462,641.3579" fill="#FFF0C7" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.3122" x="12" y="660.2549">Outcome writes are fenced to the lease holder:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.1112" x="12" y="677.9609">a stale worker back from the dead cannot</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.1032" x="12" y="695.667">overwrite the attempt that replaced it.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.3462" x="12" y="713.373">Mutations forward their acknowledgment to the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.9032" x="12" y="731.079">deploy id, so outcomes are readable after</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.6302" x="12" y="748.785">finality; reads answer on a ret channel for</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.9541" x="12" y="766.491">observer exploratory readback</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.8413" x="12" y="784.197">(MAIL_QUEUE_ARITIES pins both against the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.2581" x="12" y="801.9031">contract source).</text></g><!--link *start* to queued--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" data-link-type="dependency" data-source-line="18" id="lnk7"><path d="M1198.26,369.5379 C1196.79,391.1679 1190.1,444.5779 1159.67,473.1479 C1115.2,514.9079 1052.2759,530.6946 999.2359,536.9246" fill="none" id="*start*-to-queued" style="stroke:#496174;stroke-width:1;"/><polygon fill="#496174" points="994.27,537.5079,1003.6752,540.4307,999.2359,536.9246,1002.7419,532.4853,994.27,537.5079" style="stroke:#496174;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.6622" x="1200.2605" y="433.0449">enqueue -- idempotent on the content</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.9082" x="1220.1375" y="450.7509">fingerprint: a duplicate answers</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.6433" x="1190.27" y="468.457">("duplicate", original qid), creates nothing</text></g><!--link queued to leased--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="19" id="lnk8"><path d="M835.14,527.7279 C794.2,517.9579 745.34,501.2679 708.67,473.1479 C685.49,455.3679 693.96,438.1579 672.67,418.1479 C660.65,406.8479 650.3452,399.3864 635.9652,391.0464" fill="none" id="queued-to-leased" style="stroke:#496174;stroke-width:1;"/><polygon fill="#496174" points="631.64,388.5379,637.4186,396.5134,635.9652,391.0464,641.4322,389.5931,631.64,388.5379" style="stroke:#496174;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.2262" x="709.67" y="442.0449">lease(qid, worker, ttl, now)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.5721" x="718.497" y="459.7509">-&gt; ("leased", qid, expiry)</text></g><!--link leased to queued--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" data-link-type="dependency" data-source-line="24" id="lnk13"><path d="M644.13,365.4979 C723.18,372.7679 842.1,388.3779 875.67,418.1479 C899.65,439.4179 908.3523,470.41 911.9423,497.89" fill="none" id="leased-to-queued" style="stroke:#496174;stroke-width:1;"/><polygon fill="#496174" points="912.59,502.8479,915.3904,493.4056,911.9423,497.89,907.4578,494.4419,912.59,502.8479" style="stroke:#496174;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.5672" x="907.12" y="442.0449">defer(qid, worker, code, nextAttemptAt)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="175.1621" x="940.8225" y="459.7509">-- attempts + 1, lease cleared</text></g><!--link leased to leased--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" data-link-type="dependency" data-source-line="20" id="lnk9"><path d="M644.24,342.9779 C663.91,343.8679 678.85,349.2379 678.85,359.0779 C678.85,368.9279 668.905,374.0744 649.235,374.9544" fill="none" id="leased-to-leased" style="stroke:#496174;stroke-width:1;"/><polygon fill="#496174" points="644.24,375.1779,653.4098,378.7717,649.235,374.9544,653.0522,370.7797,644.24,375.1779" style="stroke:#496174;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.9121" x="703.895" y="355.4749">lease while unexpired</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.0022" x="684.85" y="373.1809">-&gt; ("busy", holder) -- refused</text></g><!--link leased to ambiguous--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="21" id="lnk10"><path d="M642.68,329.5579 C654.28,321.7379 664.73,312.0079 671.67,300.0179 C691.7,265.3879 687.45,246.7679 671.67,210.0179 C661.99,187.4579 647.8907,170.9699 629.8307,155.3399" fill="none" id="leased-to-ambiguous" style="stroke:#496174;stroke-width:1;"/><polygon fill="#496174" points="626.05,152.0679,630.2377,160.9821,629.8307,155.3399,635.4729,154.933,626.05,152.0679" style="stroke:#496174;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.7991" x="726.895" y="242.4149">now &gt; expiresAt</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.1932" x="705.198" y="260.1209">(no transition on chain;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.3092" x="686.14" y="277.827">a queryable fact, not a guess)</text></g><!--link ambiguous to leased--><g class="link" data-entity-1="ent0003" data-entity-2="ent0002" data-link-type="dependency" data-source-line="22" id="lnk11"><path d="M483.23,151.9779 C460.01,166.5679 437.78,185.7179 424.67,210.0179 C405.68,245.2179 402.22,266.9179 424.67,300.0179 C441.21,324.3979 464.9888,337.108 492.4988,345.318" fill="none" id="ambiguous-to-leased" style="stroke:#496174;stroke-width:1;"/><polygon fill="#496174" points="497.29,346.7479,489.8098,340.3412,492.4988,345.318,487.522,348.0071,497.29,346.7479" style="stroke:#496174;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.6551" x="476.3506" y="224.9149">lease by a new worker</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.1942" x="434.081" y="242.6209">-&gt; ("leased-ambiguous", qid, expiry):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.7402" x="433.808" y="260.327">the caller is TOLD the prior outcome</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.7142" x="433.821" y="278.033">is unknown -- consult the run ledger</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.0162" x="425.67" y="295.739">(claimRun/lookupRun) before re-acting</text></g><!--link leased to delivered--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="23" id="lnk12"><path d="M497.06,359.5179 C391.5,360.4679 205.11,369.2479 162.67,418.1479 C140.49,443.7079 144.9254,479.9966 152.4754,507.4766" fill="none" id="leased-to-delivered" style="stroke:#496174;stroke-width:1;"/><polygon fill="#496174" points="153.8,512.2979,155.2727,502.5598,152.4754,507.4766,147.5586,504.6792,153.8,512.2979" style="stroke:#496174;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.9962" x="163.67" y="442.0449">delivered(qid, worker, response, now)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.8821" x="220.7271" y="459.7509">-- lease holder only</text></g><!--link leased to bounced--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="25" id="lnk14"><path d="M497.33,375.0279 C471.71,383.6579 444.85,397.1579 426.67,418.1479 C4