name: Embers
run-name: >-
  Embers ${{
    github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name ||
    github.event_name == 'push' && github.ref_name == 'main' && 'main' ||
    github.event_name == 'pull_request' && format('MR {0}', github.event.pull_request.title) ||
    github.ref_name
  }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ["*"]
    paths:
      - ".github/workflows/embers.yaml"
      - "apps/embers/**"
      - "e2e/**"
      - "packages/oslf-editor/**"
      - "packages/client/**"
      - "packages/api-conformance/**"
      - "*"
      - "!**/*.md"
  pull_request:
    paths:
      - ".github/workflows/embers.yaml"
      - "apps/embers/**"
      - "e2e/**"
      - "packages/oslf-editor/**"
      - "packages/client/**"
      - "packages/api-conformance/**"
      - "*"
      - "!**/*.md"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: apps/embers

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up pnpm
        # No version here on purpose: the action reads the
        # `packageManager` field from package.json, so CI installs with
        # the same pnpm that wrote pnpm-lock.yaml. With `latest`, a pnpm
        # release could reject the lockfile under --frozen-lockfile.
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter @f1r3fly-io/embers-client-sdk build

      - name: Build oslf-editor
        run: pnpm --filter @f1r3fly-io/oslf-editor build

      - name: Type check
        run: pnpm run typecheck

      - name: Code format check
        run: pnpm run ci:check:code

      - name: CSS format check
        run: pnpm run ci:check:css

      - name: Lint
        run: pnpm run ci:lint

      # The application's own test suite. It had never run in CI: only the two
      # library packages had a Test step, so every regression in apps/embers
      # depended on someone remembering to run jest locally. The coverage
      # thresholds in its jest config are enforced here too, so a drop in
      # coverage fails the build rather than passing unnoticed.
      - name: Test
        run: pnpm --filter @f1r3fly-io/embers-frontend test -- --coverage

      # Likewise the OSLF editor, whose workflow only runs when files under
      # packages/oslf-editor change -- and this workflow already builds it, so
      # a change here that breaks it would otherwise go unnoticed until later.
      - name: Test OSLF editor
        run: pnpm --filter @f1r3fly-io/oslf-editor test -- --coverage

      # The offline half of the API-conformance harness: the route table, the
      # component schemas, and the validator that judges a response against
      # them. It needs no network and no chain, and it is where the contract
      # gaps reported upstream are measured -- so an upstream fix shows up
      # here as a failing expectation rather than going unnoticed. The LIVE
      # half is opt-in and never runs in CI.
      - name: Test API conformance
        run: pnpm --filter @f1r3fly-io/embers-api-conformance test -- --coverage

      - name: Build project
        run: pnpm run build

      - name: Verify .module.d.scss.ts
        run: |
          git diff --quiet --exit-code || {
            echo '::error::Found uncommitted .module.d.scss.ts files.'
            git --no-pager diff
            exit 1
          }

  publish-docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: f1r3flyio/embers-frontend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: apps/embers/Dockerfile
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            "npmrc=@f1r3fly-io:registry=https://npm.pkg.github.com
            //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"

  # Browser-level tests against a stand-in backend. Separate from the build job
  # because it needs a browser and a served build, and because a failure here
  # should be readable as "the application misbehaves" rather than "the build
  # broke". A second tier, against the real local stack, is deliberately NOT
  # here: it needs a running node and cannot be hermetic.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          pnpm --filter @f1r3fly-io/embers-client-sdk build
          pnpm --filter @f1r3fly-io/oslf-editor build

      - name: Build application
        run: pnpm --filter @f1r3fly-io/embers-frontend build

      # Cached by lockfile: the browser is ~120MB and does not change between
      # runs unless the Playwright version does.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ~/.cache/ms-playwright

      - name: Install browser
        run: pnpm --filter @f1r3fly-io/embers-e2e exec playwright install chromium --with-deps

      - name: Run end-to-end tests
        run: pnpm --filter @f1r3fly-io/embers-e2e e2e

      # Only on failure, and only for a week: traces and videos are large, and
      # their value is in diagnosing the run that just failed.
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

